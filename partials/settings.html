<!-- Einstellungen für Barrierefreiheit und Darstellung -->
<details class="settings">
  <summary>
    <span class="visually-hidden">Einstellungen</span>
    <span class="icon icon-settings" aria-hidden="true"></span>
  </summary>

  <div class="container">
    <div class="settings-group settings-group-font">
      <p class="settings-title">Schriftgröße</p>
      <button type="button" data-setting="font-decrease" aria-label="Schriftgröße verkleinern">-</button>
      <span data-setting="font-size-value">16px</span>
      <button type="button" data-setting="font-increase" aria-label="Schriftgröße vergrößern">+</button>
      <button class="settings-icon-button" type="button" data-setting="font-reset" aria-label="Schriftgröße zurücksetzen">
        <span class="icon icon-reset" aria-hidden="true"></span>
      </button>
    </div>

    <div class="settings-group settings-group-toggle">
      <p class="settings-title">Dunkler Modus</p>
      <button class="settings-toggle" type="button" data-setting="theme" role="switch" aria-checked="false" aria-label="Dunklen Modus umschalten">
        <span class="settings-toggle-track" aria-hidden="true">
          <span class="settings-toggle-thumb"></span>
        </span>
      </button>
    </div>

    <div class="settings-group settings-group-toggle">
      <p class="settings-title">Hoher Kontrast</p>
      <button class="settings-toggle" type="button" data-setting="contrast" role="switch" aria-checked="false" aria-label="Hohen Kontrast umschalten">
        <span class="settings-toggle-track" aria-hidden="true">
          <span class="settings-toggle-thumb"></span>
        </span>
      </button>
    </div>

    <div class="settings-group settings-group-toggle">
      <p class="settings-title">Animationen reduzieren</p>
      <button class="settings-toggle" type="button" data-setting="motion" role="switch" aria-checked="false" aria-label="Reduzierte Animationen umschalten">
        <span class="settings-toggle-track" aria-hidden="true">
          <span class="settings-toggle-thumb"></span>
        </span>
      </button>
    </div>
  </div>
</details>
