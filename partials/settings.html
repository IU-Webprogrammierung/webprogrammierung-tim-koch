<!-- Einstellungen für Barrierefreiheit und Darstellung -->
<details class="settings">
  <summary>
    <span class="visually-hidden">Einstellungen</span>
    <span class="icon icon-settings" aria-hidden="true"></span>
  </summary>

  <div class="container">
    <div class="settings-group">
      <p class="settings-title">Schriftgr&ouml;&szlig;e</p>
      <button type="button" aria-label="Schriftgr&ouml;&szlig;e verkleinern">-</button>
      <span>16px</span>
      <button type="button" aria-label="Schriftgr&ouml;&szlig;e vergr&ouml;&szlig;ern">+</button>
      <button type="button" aria-label="Schriftgr&ouml;&szlig;e zur&uuml;cksetzen">Zur&uuml;cksetzen</button>
    </div>

    <div class="settings-group">
      <p class="settings-title">Dunkler Modus</p>
      <button type="button" aria-pressed="false">Deaktiviert</button>
    </div>

    <div class="settings-group">
      <p class="settings-title">Hoher Kontrast</p>
      <button type="button" aria-pressed="false">Deaktiviert</button>
    </div>

    <div class="settings-group">
      <p class="settings-title">Animationen reduzieren</p>
      <button type="button" aria-pressed="false">Deaktiviert</button>
    </div>
  </div>
</details>
